<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utopia Gacha Test (Real Landscape)</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .box {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div class="box" id="main-content">
        <h2 style="color: #4caf50;">Landscape Asli Telegram 🖥️</h2>
        <p>Halo, <span id="username" style="color: #64b5f6; font-weight: bold;">Loading...</span>!</p>
        <p style="font-size: 14px; color: #aaa;">Ini menggunakan API Mini Apps 2.0 yang sah.</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;

        // 1. Beritahu Telegram kalau aplikasi sudah siap
        tg.ready();

        // 2. Minta Telegram masuk ke mode Layar Penuh (Fullscreen)
        // Ini yang membuat jendela di Telegram PC langsung melebar
        if (tg.requestFullscreen) {
            tg.requestFullscreen();
        }

        // 3. KUNCI orientasi ke Landscape
        // Ini API valid Telegram yang memaksa HP langsung miring
        if (tg.lockOrientation) {
            tg.lockOrientation('landscape');
        }

        // Tampilkan nama user
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('username').innerText = user.first_name;
        } else {
            document.getElementById('username').innerText = "Player";
        }
    </script>
</body>
</html>
