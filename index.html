<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujicoba Mini App Haikha</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            max-width: 80%;
        }
        button {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
        /* Style untuk layar blokir */
        .error-text {
            color: #ef5350;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="box" id="main-content" style="display: none;">
        <h2>Ujicoba Mini App 🚀</h2>
        <p>Halo, <span id="username" style="color: #64b5f6; font-weight: bold;">Loading...</span>!</p>
        <button onclick="testKlik()">Coba Klik Aku</button>
    </div>

    <div class="box" id="block-screen" style="display: none;">
        <h2 class="error-text">Akses Ditolak! ❌</h2>
        <p>Game ini cuma bisa dimainkan di dalam **Telegram Mini App**.</p>
        <p style="font-size: 13px; color: #aaa;">Silakan buka bot resmi kamu di aplikasi Telegram.</p>
    </div>

    <script>
        // Ambil data inisialisasi dari Telegram
        const tg = window.Telegram.WebApp;
        
        // Cek apakah aplikasi dibuka di dalam lingkungan Telegram yang valid
        // Jika dibuka di browser biasa, tg.initData akan berupa string kosong ""
        if (tg.initData && tg.initData !== "") {
            
            // 1. Beritahu Telegram kalau web sudah siap
            tg.ready();
            
            // 2. Munculkan konten utama game
            document.getElementById('main-content').style.display = 'block';
            
            // 3. Ambil data user Telegram
            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById('username').innerText = user.first_name;
            } else {
                document.getElementById('username').innerText = "User Telegram";
            }

        } else {
            // Jika dibuka di luar Telegram (Chrome, Safari, PC Browser biasa)
            // Tampilkan layar blokir, sembunyikan game
            document.getElementById('block-screen').style.display = 'block';
        }

        // Fungsi tombol bawaan
        function testKlik() {
            tg.showAlert("Kodenya jalan jir! Mini App sukses tersambung.");
        }
    </script>
</body>
</html>
