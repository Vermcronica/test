<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujicoba Mini App Haikha</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Ujicoba Mini App 🚀</h2>
        <p>Halo, <span id="username" style="color: #64b5f6; font-weight: bold;">Loading...</span>!</p>
        <button onclick="testKlik()">Coba Klik Aku</button>
    </div>

    <script>
        // Beritahu Telegram kalau Mini App sudah siap ditampilkan
        window.Telegram.WebApp.ready();

        // Mengambil data user yang sedang membuka bot
        const user = window.Telegram.WebApp.initDataUnsafe?.user;
        
        if (user) {
            document.getElementById('username').innerText = user.first_name;
        } else {
            document.getElementById('username').innerText = "User Luar Telegram";
        }

        // Fungsi tombol ketika diklik
        function testKlik() {
            window.Telegram.WebApp.showAlert("Kodenya jalan jir! Mini App sukses tersambung.");
        }
    </script>
</body>
</html>
