<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujicoba Mini App Landscape</title>
    <script src="https://telegram.org/js/telegram-web-app.js?2"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .box {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            max-width: 80%;
        }
        button {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1c6da3;
        }
        .error-text {
            color: #ef5350;
            font-weight: bold;
        }
        .status-badge {
            background-color: #388e3c;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="box" id="main-content" style="display: none;">
        <div class="status-badge">Mode Landscape Aktif 🖥️</div>
        <h2>Utopia Gacha Test</h2>
        <p>Halo, <span id="username" style="color: #64b5f6; font-weight: bold;">Loading...</span>!</p>
        <p style="font-size: 14px; color: #aaa;">Jendela ini otomatis melebar secara horizontal di PC.</p>
        <button onclick="testKlik()">Coba Klik Aku</button>
    </div>

    <div class="box" id="block-screen" style="display: none;">
        <h2 class="error-text">Akses Ditolak! ❌</h2>
        <p>Game ini cuma bisa dimainkan di dalam **Telegram Mini App**.</p>
        <p style="font-size: 13px; color: #aaa;">Silakan buka bot resmi kamu melalui aplikasi Telegram HP atau Desktop.</p>
    </div>

    <script>
        // Inisialisasi API Telegram WebApp
        const tg = window.Telegram.WebApp;
        
        // Cek validasi lingkungan Telegram via initData
        if (tg.initData && tg.initData !== "") {
            
            // 1. Beritahu Telegram kalau aplikasi siap di-render
            tg.ready();
            
            // 2. Paksa masuk ke mode Fullscreen agar jendela Desktop langsung melebar lebar ke samping
            if (tg.requestFullscreen) {
                tg.requestFullscreen();
            }

            // 3. Kunci orientasi ke Landscape (Memaksa HP berputar miring)
            if (tg.requestOrientation) {
                tg.requestOrientation('landscape');
            }
            
            // 4. Tampilkan area game utama
            document.getElementById('main-content').style.display = 'block';
            
            // 5. Ambil data nama user Telegram
            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById('username').innerText = user.first_name;
            } else {
                document.getElementById('username').innerText = "User Telegram";
            }

        } else {
            // Jika dibuka di Chrome/Safari biasa di luar Telegram, langsung blokir
            document.getElementById('block-screen').style.display = 'block';
        }
